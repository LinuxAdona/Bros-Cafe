---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/broscafe/public_html/

    # Create necessary directories
    - mkdir -p $DEPLOYPATH
    - mkdir -p $DEPLOYPATH/config
    - mkdir -p $DEPLOYPATH/database
    - mkdir -p $DEPLOYPATH/public
    - mkdir -p $DEPLOYPATH/public/assets
    - mkdir -p $DEPLOYPATH/public/assets/css
    - mkdir -p $DEPLOYPATH/public/assets/js
    - mkdir -p $DEPLOYPATH/public/assets/images
    - mkdir -p $DEPLOYPATH/public/assets/images/products
    - mkdir -p $DEPLOYPATH/public/pages
    - mkdir -p $DEPLOYPATH/public/pages/usr
    - mkdir -p $DEPLOYPATH/src
    - mkdir -p $DEPLOYPATH/src/services
    - mkdir -p $DEPLOYPATH/src/fpdf_fonts

    # Copy root files
    - /bin/cp index.php $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp 400.shtml $DEPLOYPATH
    - /bin/cp 401.shtml $DEPLOYPATH
    - /bin/cp 403.shtml $DEPLOYPATH
    - /bin/cp 404.shtml $DEPLOYPATH
    - /bin/cp 500.shtml $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp README.md $DEPLOYPATH
    - /bin/cp DATABASE_IMAGE_INTEGRATION.md $DEPLOYPATH

    # Copy directories recursively
    - /bin/cp -R config $DEPLOYPATH/config/
    - /bin/cp -R database $DEPLOYPATH/database/
    - /bin/cp -R public $DEPLOYPATH/public/
    - /bin/cp -R src $DEPLOYPATH/src/

    # Set proper permissions
    - chmod 755 $DEPLOYPATH
    - chmod 755 $DEPLOYPATH/public
    - chmod 755 $DEPLOYPATH/public/pages
    - chmod 755 $DEPLOYPATH/public/pages/usr
    - chmod 755 $DEPLOYPATH/public/assets
    - chmod 755 $DEPLOYPATH/public/assets/images
    - chmod 777 $DEPLOYPATH/public/assets/images/products
    - chmod 644 $DEPLOYPATH/config/database.php
    - chmod 644 $DEPLOYPATH/index.php

    # Set permissions for writable directories (for image uploads, logs, etc.)
    - find $DEPLOYPATH/public/assets/images/products -type d -exec chmod 777 {} \;
    - find $DEPLOYPATH/public/assets/images/products -type f -exec chmod 666 {} \;
