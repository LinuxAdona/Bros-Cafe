---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/broscafe/public_html/
    - mkdir -p $DEPLOYPATH
    - cp -r . $DEPLOYPATH
    - chmod -R 755 $DEPLOYPATH

    # Set permissions for writable directories (for image uploads, logs, etc.)
    - find $DEPLOYPATH/public/assets/images/products -type d -exec chmod 777 {} \;
    - find $DEPLOYPATH/public/assets/images/products -type f -exec chmod 666 {} \;
