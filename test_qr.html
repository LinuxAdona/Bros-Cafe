<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Test</title>
</head>
<body>
    <h1>QR Code Test</h1>
    <div id="qrcode"></div>
    <p id="status">Loading...</p>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const testValue = 'ADMIN_1_1234567890_testhash123';
        
        // Check if QRCode is loaded
        if (typeof QRCode !== 'undefined') {
            document.getElementById('status').textContent = 'QRCode library loaded!';
            console.log('QRCode object:', QRCode);
            
            // Try generating QR code
            const container = document.getElementById('qrcode');
            
            QRCode.toCanvas(testValue, {
                width: 250,
                margin: 2,
                color: {
                    dark: '#4F46E5',
                    light: '#FFFFFF'
                }
            }, function(error, canvas) {
                if (error) {
                    console.error('Error:', error);
                    document.getElementById('status').textContent = 'Error: ' + error.message;
                    return;
                }
                console.log('Success! Canvas:', canvas);
                canvas.style.border = '2px solid green';
                container.appendChild(canvas);
                document.getElementById('status').textContent = 'QR Code generated successfully!';
            });
        } else {
            document.getElementById('status').textContent = 'QRCode library NOT loaded!';
        }
    </script>
</body>
</html>
